<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; media-src 'self' data: blob: https:; worker-src 'self' blob:" />
    <!-- The web portal is desktop-only. On phones the complete 1280px desktop
         canvas is scaled to fit the device; it must never become a mobile UI
         or require horizontal panning. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      html,
      body {
        width: 100%;
        min-width: 0;
        margin: 0;
        overflow-x: hidden;
      }

      body { direction: ltr; }

      /*
       * The web portal is a single desktop canvas. 1480px is the largest
       * layout width used by the platform pages, so the canvas must be at
       * least that wide. It is centered on desktop displays and scaled down
       * as one piece on phones, including Chrome "Desktop site" mode.
       */
      #root {
        width: 1480px;
        min-width: 1480px;
        margin: 0 auto;
        zoom: 1;
      }

      @media (max-width: 1480px) {
        #root {
          margin-left: 0;
          margin-right: 0;
          zoom: calc(100vw / 1480);
        }
      }

      @media (max-width: 600px) {
        /*
         * Chrome Android can expose a desktop-sized layout viewport when
         * "Desktop site" is enabled. screen.width still gives the screen
         * width in CSS pixels, so use it to keep the complete desktop canvas
         * visible instead of showing a clipped slice.
         */
        #root {
          zoom: min(1, calc(screen-width / 1480));
        }
      }
    </style>
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
