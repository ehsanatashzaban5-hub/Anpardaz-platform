services:
  anpardaz-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    image: anpardaz-mobile:local
    container_name: anpardaz-mobile
    ports:
      - "127.0.0.1:5175:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
