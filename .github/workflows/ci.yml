name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: anpardaz-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anpardaz-service
            path: services/anpardaz
          - name: ansarraf-service
            path: services/ansarraf
          - name: platform-service
            path: services/platform
          - name: banner-service
            path: services/banner
          - name: accounting-service
            path: services/accounting
          - name: accounting-client
            path: packages/accounting-client
          - name: mobile
            path: apps/mobile
          - name: web
            path: apps/web
          - name: admin
            path: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/mobile/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: pnpm install --no-frozen-lockfile
      - name: Build
        working-directory: ${{ matrix.path }}
        run: pnpm run build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Regression tests
        if: matrix.name == 'ansarraf-service'
        working-directory: ${{ matrix.path }}
        run: pnpm test
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: ${{ matrix.path }}/build.log
      - name: Job summary
        if: always()
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build target: ${{ matrix.path }}" >> "$GITHUB_STEP_SUMMARY"
