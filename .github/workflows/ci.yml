name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: anpardaz-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  database-migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            path: databases/platform
            database: platform
          - name: anpardaz
            path: databases/anpardaz
            database: anpardaz
          - name: accounting
            path: databases/accounting
            database: accounting
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create migration database
        env:
          PGPASSWORD: ci-password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 5432 -U ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${{ matrix.database }}"
      - name: Apply migrations
        env:
          PGPASSWORD: ci-password
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          for file in $(find . -maxdepth 1 -name '*.sql' -print | sort -V); do
            echo "Applying $file"
            psql -h 127.0.0.1 -p 5432 -U ci -d "${{ matrix.database }}" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify migration marker
        env:
          PGPASSWORD: ci-password
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -p 5432 -U ci -d "${{ matrix.database }}" -Atqc "SELECT COUNT(*) FROM schema_migrations")" -gt 0

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anpardaz-service
            path: services/anpardaz
          - name: ansarraf-service
            path: services/ansarraf
          - name: platform-service
            path: services/platform
          - name: banner-service
            path: services/banner
          - name: accounting-service
            path: services/accounting
          - name: accounting-client
            path: packages/accounting-client
          - name: mobile
            path: apps/mobile
          - name: web
            path: apps/web
          - name: admin
            path: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          if [ "${{ matrix.name }}" = "mobile" ]; then
            pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          elif [ "${{ matrix.name }}" = "web" ]; then
            pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          elif [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile --ignore-scripts
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Build
        working-directory: ${{ matrix.path }}
        run: pnpm run build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Regression tests
        if: matrix.name == 'ansarraf-service'
        working-directory: ${{ matrix.path }}
        run: pnpm test
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: ${{ matrix.path }}/build.log
      - name: Job summary
        if: always()
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build target: ${{ matrix.path }}" >> "$GITHUB_STEP_SUMMARY"
