name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: anpardaz-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  migration-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Audit migration ordering and domain boundaries
        run: node scripts/audit-migrations.mjs

  production-readiness-static:
    runs-on: ubuntu-latest
    needs: migration-dependency-audit
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Final static production gate
        run: node scripts/production-readiness-static.mjs

  database-migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            path: databases/platform
            database: platform
          - name: anpardaz
            path: databases/anpardaz
            database: anpardaz
          - name: ansarraf
            path: databases/ansarraf
            database: ansarraf
          - name: accounting
            path: databases/accounting
            database: accounting
          - name: banner
            path: databases/banner
            database: banner
          - name: hoosh
            path: databases/hoosh
            database: hoosh
          - name: market
            path: databases/market
            database: market
          - name: financial
            path: databases/financial
            database: financial
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create migration database
        env:
          PGPASSWORD: ci-password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 5432 -U ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${{ matrix.database }}"
      - name: Apply migrations
        env:
          PGPASSWORD: ci-password
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          for file in $(find . -maxdepth 1 -name '*.sql' -print | sort -V); do
            echo "Applying $file"
            psql -h 127.0.0.1 -p 5432 -U ci -d "${{ matrix.database }}" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify migration marker
        env:
          PGPASSWORD: ci-password
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -p 5432 -U ci -d "${{ matrix.database }}" -Atqc "SELECT COUNT(*) FROM schema_migrations")" -gt 0

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anpardaz-service
            path: services/anpardaz
          - name: ansarraf-service
            path: services/ansarraf
          - name: platform-service
            path: services/platform
          - name: admin-service
            path: services/admin
          - name: banner-service
            path: services/banner
          - name: accounting-service
            path: services/accounting
          - name: hoosh-service
            path: services/hoosh
          - name: market-service
            path: services/market
          - name: financial-service
            path: services/financial
          - name: accounting-client
            path: packages/accounting-client
          - name: mobile
            path: apps/mobile
          - name: web
            path: apps/web
          - name: admin
            path: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.3.0
        with:
          version: 11.24.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
          else
            pnpm install --no-frozen-lockfile --ignore-scripts
          fi
      - name: Build
        working-directory: ${{ matrix.path }}
        run: pnpm run build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Regression tests
        if: matrix.name == 'ansarraf-service'
        working-directory: ${{ matrix.path }}
        run: pnpm test
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log-${{ matrix.name }}
          path: ${{ matrix.path }}/build.log
      - name: Job summary
        if: always()
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build target: ${{ matrix.path }}" >> "$GITHUB_STEP_SUMMARY"
