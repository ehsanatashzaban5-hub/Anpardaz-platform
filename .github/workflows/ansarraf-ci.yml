name: An Sarraf integration CI

on:
  push:
    branches:
      - main
      - fix/ansarraf-mobile-web-live-integration
  pull_request:
    branches:
      - main
permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --no-frozen-lockfile --ignore-scripts
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add apps/mobile/pnpm-lock.yaml && git diff --cached --quiet || git commit -m "chore: refresh mobile pnpm lockfile"
      - run: git push origin HEAD:${{ github.head_ref }}
      - run: pnpm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm run build

  ansarraf-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ansarraf
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
