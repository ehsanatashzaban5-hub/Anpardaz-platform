name: An Sarraf integration CI

on:
  push:
    branches:
      - main
      - fix/ansarraf-mobile-web-live-integration
  pull_request:
    branches:
      - main

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build

  ansarraf-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ansarraf
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/ansarraf/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
