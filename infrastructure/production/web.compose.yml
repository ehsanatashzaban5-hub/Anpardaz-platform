services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PLATFORM_API_URL: ${VITE_PLATFORM_API_URL:-}
        VITE_ANPARDAZ_API_URL: ${VITE_ANPARDAZ_API_URL:-/anpardaz}
        VITE_ANSARRAF_API_URL: ${VITE_ANSARRAF_API_URL:-/ansarraf}
        VITE_BANNER_API_URL: ${VITE_BANNER_API_URL:-/banner}
    restart: unless-stopped
    env_file:
      - ./web.env
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
