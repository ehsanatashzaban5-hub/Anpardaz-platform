version: "3.8"
networks:
  anpardaz-internal:
    external: true

services:
  accounting:
    build:
      context: ../..
      dockerfile: services/accounting/Dockerfile
    restart: unless-stopped
    env_file:
      - ./accounting.env
    ports:
      - "127.0.0.1:4004:4004"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - anpardaz-internal
