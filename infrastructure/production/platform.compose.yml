version: "3.8"
networks:
  anpardaz-internal:
    external: true

services:
  platform:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    restart: unless-stopped
    env_file:
      - ./platform.env
    ports:
      - "127.0.0.1:4003:4003"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - anpardaz-internal

  banner:
    build:
      context: ../..
      dockerfile: services/banner/Dockerfile
    restart: unless-stopped
    env_file:
      - ./banner.env
    ports:
      - "127.0.0.1:4005:4005"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - anpardaz-internal

  hoosh:
    build:
      context: ../..
      dockerfile: services/hoosh/Dockerfile
