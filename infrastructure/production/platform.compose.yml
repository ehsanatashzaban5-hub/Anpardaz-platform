services:
  banner:
    build:
      context: ../..
      dockerfile: services/banner/Dockerfile
    restart: unless-stopped
    env_file:
      - ./banner.env
    ports:
      - "127.0.0.1:4005:4005"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    restart: unless-stopped
    env_file:
      - ./platform.env
    ports:
      - "127.0.0.1:4003:4003"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform-market-data-worker:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    command: ["node", "dist/workers/market-data.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-hoosh-worker:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    command: ["node", "dist/workers/hoosh.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-hoosh-media-worker:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    command: ["node", "dist/workers/hoosh-media.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-market-ingestion-worker:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    command: ["node", "dist/workers/market-ingestion.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-market-discovery-worker:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    command: ["node", "dist/workers/market-store-discovery.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  hoosh:
    build: {context: ../.., dockerfile: services/hoosh/Dockerfile}
    restart: unless-stopped
    env_file: [./hoosh.env]
    ports: ["127.0.0.1:4008:4008"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  market:
