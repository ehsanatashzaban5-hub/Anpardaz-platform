services:
  banner:
    build:
      context: ../../services/banner
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./banner.env
    ports:
      - "127.0.0.1:4005:4005"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform:
    build:
      context: ../../services/platform
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./platform.env
    ports:
      - "127.0.0.1:4003:4003"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform-market-data-worker:
    build:
      context: ../../services/platform
      dockerfile: Dockerfile
    command: ["node", "dist/workers/market-data.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-hoosh-worker:
    build:
      context: ../../services/platform
      dockerfile: Dockerfile
    command: ["node", "dist/workers/hoosh.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-hoosh-media-worker:
    build:
      context: ../../services/platform
      dockerfile: Dockerfile
    command: ["node", "dist/workers/hoosh-media.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-market-ingestion-worker:
    build:
      context: ../../services/platform
      dockerfile: Dockerfile
    command: ["node", "dist/workers/market-ingestion.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  platform-market-discovery-worker:
