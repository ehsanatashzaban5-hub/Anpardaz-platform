version: "3.3"
networks:
  anpardaz-internal:
    external: true

services:
  anpardaz:
    build:
      context: ../..
      dockerfile: services/anpardaz/Dockerfile
    restart: unless-stopped
    env_file:
      - ./anpardaz.env
    ports:
      - "127.0.0.1:4001:4001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - anpardaz-internal
