networks:
  anpardaz-internal:
    external: true

services:
    networks: [anpardaz-internal]
  ansarraf:
    build:
      context: ../..
      dockerfile: services/ansarraf/Dockerfile
    restart: unless-stopped
    env_file:
      - ./ansarraf.env
    ports:
      - "127.0.0.1:4002:4002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks: [anpardaz-internal]