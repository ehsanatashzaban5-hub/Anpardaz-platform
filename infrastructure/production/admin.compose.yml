services:
  admin:
    build:
      context: ../..
      dockerfile: services/admin/Dockerfile
    env_file:
      - admin.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:4006:4006"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
