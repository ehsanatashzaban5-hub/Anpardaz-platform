# Host-level HTTPS reverse proxy for anpardaz.ir.
# PostgreSQL and backend ports remain private; only 80/443 are public.

server {
  listen 80;
  server_name anpardaz.ir www.anpardaz.ir;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name anpardaz.ir www.anpardaz.ir;
  ssl_certificate /etc/letsencrypt/live/anpardaz.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/anpardaz.ir/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /admin/ {
    proxy_pass http://127.0.0.1:4006/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /platform/ {
    proxy_pass http://127.0.0.1:4003/;
    proxy_http_version 1.1;
