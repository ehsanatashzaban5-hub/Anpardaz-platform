services:
  anpardaz-mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    image: anpardaz-mobile:local
    container_name: anpardaz-mobile
    restart: unless-stopped
    ports:
      - "5175:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
