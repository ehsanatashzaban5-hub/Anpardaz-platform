services:
  anpardaz-db:
    image: postgres:17
    container_name: anpardaz-db
    restart: unless-stopped
    read_only: false
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      POSTGRES_DB: ${ANPARDAZ_DB_NAME:-anpardaz}
      POSTGRES_USER: ${ANPARDAZ_DB_USER:-anpardaz}
      POSTGRES_PASSWORD: ${ANPARDAZ_DB_PASSWORD:?Set ANPARDAZ_DB_PASSWORD}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
    volumes: [anpardaz-db-data:/var/lib/postgresql/data]
